    <text y="52" font-size="21" font-weight="500" fill="#a8a49a" letter-spacing="1.5">Private recovery room</text>
    <text y="96" font-size="17" font-weight="500" fill="#6d6a63" letter-spacing="2">PHOTO PLACEHOLDER &#183; 1200&#215;900</text>
